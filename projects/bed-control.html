<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>bed control — NordLab</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <a href="../index.html" class="brand">
            <img
                src="../assets/images/nordlab-logo.png"
                alt="NordLab"
            >
        </a>

        <nav class="nav">
            <a href="../index.html" class="nav-link" data-i18n="nav.home">
                HOME
            </a>

            <a href="../index.html#projects" class="nav-link active" data-i18n="nav.projects">
                PROJECTS
            </a>

            <a href="../index.html#about" class="nav-link" data-i18n="nav.about">
                ABOUT
            </a>

            <a href="../index.html#contact" class="nav-link" data-i18n="nav.contact">
                CONTACT
            </a>
        </nav>

        <div class="language-switcher" aria-label="Language selector">

        <button
            type="button"
            class="language-button active"
            data-lang="en"
            aria-pressed="true"
        >
            EN
        </button>

        <span>/</span>

        <button
            type="button"
            class="language-button"
            data-lang="es"
            aria-pressed="false"
        >
            ES
        </button>

        </div>

    </header>


    <!-- PROJECT -->
    <main class="project-page">

        <!-- PROJECT HEADER -->
        <section class="project-header">

            <h1 data-i18n="project.title.bedcontrol">
                BED CONTROL
            </h1>

            <div class="project-hero">
                <img
                    src="../assets/images/projects/bed-control/cover.jpg"
                    alt="Bed Control"
                >
            </div>

            <p class="project-category" data-i18n="projects.bed.category">
                Custom Design
            </p>

        </section>


        <!-- DESCRIPTION -->
        <section class="project-description">

            <h2 data-i18n-html="project.description">
                From digital model<br>
                to physical object.
            </h2>

        </section>


        <!-- GALLERY -->
        <section class="project-gallery">

            <div class="section-title">
                <h2 data-i18n="gallery.title">
                    GALLERY
                </h2>
                <span></span>
            </div>

            <div class="gallery-grid">

                <img
                    src="../assets/images/projects/bed-control/photo-01.jpg"
                    alt="Bed Control"
                >

                <img
                    src="../assets/images/projects/bed-control/photo-02.jpg"
                    alt="Bed Control"
                >

                <img
                    src="../assets/images/projects/bed-control/photo-03.jpg"
                    alt="Bed Control"
                >

            </div>

        </section>


        <!-- TOOLS -->
     
        <section class="project-details">

            <div class="section-title">
                <span></span>
                <h2 data-i18n="project.details.title">PROJECT DETAILS</h2>
                <span></span>
            </div>

            <div class="project-details-grid">

                <div class="project-detail">
                <span class="project-detail-label">MATERIAL</span>
                <span class="project-detail-value">PLA</span>
                </div>

                <div class="project-detail">
                <span class="project-detail-label">MANUFACTURING</span>
                <span class="project-detail-value">FDM 3D PRINTING</span>
                </div>

                <div class="project-detail">
                <span class="project-detail-label">LIGHTING</span>
                <span class="project-detail-value">LED</span>
                </div>

            </div>

            </section>


        <!-- ASK FOR YOURS -->
        <section class="project-back">

            <a href="../index.html#contact" class="button" data-i18n="ask">
                <span data-i18n="ask">
                    ASK FOR YOURS
                </span>
                <span>→</span>
            </a>

        </section>

        <!-- BACK TO PROJECTS -->
        <section class="project-back">

            <a href="../index.html#projects" class="button" data-i18n="back.to.projects">
                <span data-i18n="back">
                    BACK TO PROJECTS
                </span>
                <span>←</span>
            </a>

        </section>
        

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <span>NORDLAB</span>

        <div class="footer-line"></div>

        <span>3D / DESIGN / OBJECTS</span>

    </footer>

    <script src="../js/project-language.js"></script>

</body>

</html>

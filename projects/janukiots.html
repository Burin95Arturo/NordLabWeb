<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Janukiots — NordLab</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <a href="../index.html" class="brand">
            <img
                src="../assets/images/nordlab-logo.png"
                alt="NordLab"

        </a>

        <nav class="nav">
            <a href="../index.html" class="nav-link">
                HOME
            </a>

            <a href="../index.html#projects" class="nav-link active">

            </a>

            <a href="../index.html#about" class="nav-link">

            </a>

        </nav>

    </header>


    <!-- PROJECT -->
    <main class="project-page">

        <!-- PROJECT HEADER -->
        <section class="project-header">

            <h1>NORDIC LAMP</h1>

            <div class="project-hero">
                <img
                    src="../assets/images/projects/janukiots/cover.jpeg"
                    alt="Janukiots"

            </div>

            <p class="project-category">
                PRODUCT DESIGN / 3D MODELING

        <!-- DESCRIPTION -->
        <section class="project-description">

            <h2>
                From digital model<br>

            </h2>

        </section>


        <!-- GALLERY -->
        <section class="project-gallery">

            <div class="section-title">

                <span></span>
            </div>

            <div class="gallery-grid">

                <img
                    src="../assets/images/projects/janukiots/photo-01.jpg"

                <img
                    src="../assets/images/projects/janukiots/photo-02.jpg"

                >

                    src="../assets/images/projects/janukiots/photo-03.jpg"

                >

            <section class="project-details">

                <div class="section-title">
                    <span></span>

                    <span></span>
                </div>

                <div class="project-details-grid">

                    <div class="project-detail">
                    <span class="project-detail-label">MATERIAL</span>
                    <span class="project-detail-value">PLA</span>

                    <div class="project-detail">

                    <span class="project-detail-value">FDM 3D PRINTING</span>

                    </div>

        <section class="project-back">

            <a href="../index.html#contact" class="button">
